name: Startup context compatibility

on:
  push:
    paths:
      - 'scripts/loci-context.*'
      - 'scripts/loci-*-hook.js'
      - 'scripts/loci-claude-settings.js'
      - '.claude/hooks/loci-context.*'
      - '.claude/hooks/daily-context.*'
      - '.claude/settings.json'
      - '.loci/hooks/*.js'
      - '.loci/hooks/*.sh'
      - 'templates/global-claude-block.md'
      - 'tests/loci-context.test.js'
      - 'tests/context-hooks.test.js'
      - 'tests/setup-hooks.test.js'
      - 'tests/setup-web.test.js'
      - 'tests/activity-hooks.test.js'
      - 'setup-web.js'
      - 'setup-wizard.html'
      - '.github/workflows/context-compat.yml'
  pull_request:
    paths:
      - 'scripts/loci-context.*'
      - 'scripts/loci-*-hook.js'
      - 'scripts/loci-claude-settings.js'
      - '.claude/hooks/loci-context.*'
      - '.claude/hooks/daily-context.*'
      - '.claude/settings.json'
      - '.loci/hooks/*.js'
      - '.loci/hooks/*.sh'
      - 'templates/global-claude-block.md'
      - 'tests/loci-context.test.js'
      - 'tests/context-hooks.test.js'
      - 'tests/setup-hooks.test.js'
      - 'tests/setup-web.test.js'
      - 'tests/activity-hooks.test.js'
      - 'setup-web.js'
      - 'setup-wizard.html'
      - '.github/workflows/context-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  context:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests/loci-context.test.js
      - run: node tests/context-hooks.test.js
      - run: node tests/setup-hooks.test.js
      - run: node tests/setup-web.test.js
      - run: node tests/activity-hooks.test.js
