# Only engine files are managed. All user data stays untouched.
version: "0.6.1"
loci-schema: 1
managed:
  - LOCI.md
  - LOCI-RULES.md
  - README.md
  - README.en.md
  - CHANGELOG.md
  - LICENSE
  - scripts/**
  - bin/**
  - templates/**
  - integrations/**
  - docs/**
  - .loci/hooks/**
  - .loci/dashboard/**
  - .loci/engine-files.yml
  - .claude/hooks/**
  - .githooks/**
  - install.sh
  - setup.sh
  - update.sh
  - me/README.md
  - tasks/README.md
  - decisions/README.md
  - references/README.md
  - archive/README.md
# Root CLAUDE.md/AGENTS.md are merged by the installer, never copied wholesale.
