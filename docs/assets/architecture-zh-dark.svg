<title id="title">换个 Agent，记忆仍在。</title><desc id="desc">安装将 LOCI.md 合并进各 Agent 原生入口。会话启动获取同源短偏好。首次记忆操作读取 LOCI-RULES.md，再按需检索并执行工具。Agent 和 Dashboard 读写同一份本地数据，项目正文留在项目仓库。</desc>
