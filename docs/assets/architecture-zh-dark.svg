<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc" xml:lang="zh">
<title id="title">一个入口，一本手册，一套本地数据</title><desc id="desc">安装器将 LOCI.md 写入 Agent 指令入口。启动由可选 Hook 或入口调用同一偏好读取器。首次使用记忆时完整读取 LOCI-RULES.md，再按需读数据并调用脚本或本地 API。Dashboard 与 Agent 共用本地文件。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#87b79b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="960" rx="20" fill="#101915"/>
<g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Helvetica,sans-serif">
<text x="40" y="38" font-size="14" fill="#9cdbb6" font-weight="700">LOCI / ARCHITECTURE</text>
<text x="40" y="83" font-size="34" fill="#edf4ee" font-weight="700">一个入口，一本手册，一套本地数据</text>
<text x="40" y="117" font-size="20" fill="#b3c8ba" font-weight="400">规则让 Agent 知道怎么用；工具负责执行；文件保存记忆。</text>
<text x="40" y="169" font-size="18" fill="#9cdbb6" font-weight="700">01</text>
<text x="83" y="169" font-size="22" fill="#edf4ee" font-weight="650">安装一次</text>
<rect x="40" y="189" width="314" height="116" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="62" y="222" font-size="22" fill="#edf4ee" font-weight="650">LOCI.md</text>
<text x="62" y="250" font-size="19" fill="#b3c8ba" font-weight="400">短入口 · 大脑路径与触发条件</text>
<path d="M369 247 L407 247" fill="none" stroke="#87b79b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="423" y="189" width="497" height="116" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="445" y="222" font-size="22" fill="#edf4ee" font-weight="650">安装到各 Agent 原生指令入口</text>
<text x="445" y="250" font-size="19" fill="#b3c8ba" font-weight="400">Claude Code · Codex · WorkBuddy</text>
<text x="445" y="278" font-size="19" fill="#b3c8ba" font-weight="400">CLAUDE.md / AGENTS.md / MEMORY.md</text>
<text x="40" y="354" font-size="18" fill="#9cdbb6" font-weight="700">02</text>
<text x="83" y="354" font-size="22" fill="#edf4ee" font-weight="650">每次启动：只取短偏好</text>
<rect x="40" y="374" width="411" height="117" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="62" y="407" font-size="22" fill="#edf4ee" font-weight="650">有 Hook：自动提供</text>
<text x="62" y="435" font-size="19" fill="#b3c8ba" font-weight="400">无 Hook：Agent 按入口调用</text>
<text x="62" y="463" font-size="19" fill="#b3c8ba" font-weight="400">两条路径共用同一个读取器</text>
<path d="M465 432 L495 432" fill="none" stroke="#87b79b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="511" y="374" width="409" height="117" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="533" y="407" font-size="22" fill="#edf4ee" font-weight="650">loci-context.js</text>
<text x="533" y="435" font-size="19" fill="#b3c8ba" font-weight="400">读取 me/preferences.md</text>
<text x="533" y="463" font-size="19" fill="#b3c8ba" font-weight="400">输出短偏好、路径和手册指针</text>
<text x="40" y="545" font-size="18" fill="#9cdbb6" font-weight="700">03</text>
<text x="83" y="545" font-size="22" fill="#edf4ee" font-weight="650">首次需要记忆：读手册，再操作</text>
<rect x="40" y="565" width="260" height="118" rx="12" fill="#203c2c" stroke="#3d5647"/>
<text x="62" y="598" font-size="22" fill="#edf4ee" font-weight="650">LOCI-RULES.md</text>
<text x="62" y="626" font-size="19" fill="#b3c8ba" font-weight="400">完整读一次</text>
<text x="62" y="654" font-size="19" fill="#b3c8ba" font-weight="400">有效且未变时复用</text>
<path d="M310 624 L339 624" fill="none" stroke="#87b79b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="351" y="565" width="260" height="118" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="373" y="598" font-size="22" fill="#edf4ee" font-weight="650">按需读取数据</text>
<text x="373" y="626" font-size="19" fill="#b3c8ba" font-weight="400">先查索引</text>
<text x="373" y="654" font-size="19" fill="#b3c8ba" font-weight="400">再打开相关记录</text>
<path d="M621 624 L650 624" fill="none" stroke="#87b79b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="662" y="565" width="258" height="118" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="684" y="598" font-size="22" fill="#edf4ee" font-weight="650">脚本 / 本地 API</text>
<text x="684" y="626" font-size="19" fill="#b3c8ba" font-weight="400">校验、写入、关联</text>
<text x="684" y="654" font-size="19" fill="#b3c8ba" font-weight="400">按操作记录活动</text>
<rect x="40" y="704" width="382" height="78" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="62" y="737" font-size="22" fill="#edf4ee" font-weight="650">Dashboard</text>
<text x="62" y="765" font-size="19" fill="#b3c8ba" font-weight="400">人查看、修改同一份数据</text>
<path d="M231 790 L231 819" fill="none" stroke="#87b79b" stroke-width="2.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M791 696 L791 818" fill="none" stroke="#87b79b" stroke-width="2.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="40" y="831" width="880" height="65" rx="12" fill="#203c2c" stroke="#3d5647"/>
<text x="61" y="858" font-size="23" fill="#edf4ee" font-weight="650">本地 Markdown · JSON · 附件</text>
<text x="61" y="882" font-size="17" fill="#b3c8ba" font-weight="400">项目正文留在项目仓库，大脑保存索引。</text>
<text x="40" y="930" font-size="17" fill="#b3c8ba" font-weight="400">Hook 增强送达，不保证模型遵守；实际数据始终按需读取。</text>
</g></svg>
