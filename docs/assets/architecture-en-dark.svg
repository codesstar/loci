<svg xmlns="http://www.w3.org/2000/svg" width="960" height="960" viewBox="0 0 960 960" role="img" aria-labelledby="title desc" xml:lang="en">
<title id="title">One entry. One manual. Shared local data.</title><desc id="desc">The installer copies LOCI.md into native agent instructions. An optional hook or instruction fallback calls the same preference reader at startup. At first memory use, the agent reads LOCI-RULES.md, retrieves relevant data and uses scripts or local APIs. Dashboard and agents share local files.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#87b79b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="960" height="960" rx="20" fill="#101915"/>
<g font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',Helvetica,sans-serif">
<text x="40" y="38" font-size="14" fill="#9cdbb6" font-weight="700">LOCI / ARCHITECTURE</text>
<text x="40" y="83" font-size="32" fill="#edf4ee" font-weight="700">One entry. One manual. Shared local data.</text>
<text x="40" y="117" font-size="20" fill="#b3c8ba" font-weight="400">Instructions guide the agent. Tools execute. Files keep the memory.</text>
<text x="40" y="169" font-size="18" fill="#9cdbb6" font-weight="700">01</text>
<text x="83" y="169" font-size="22" fill="#edf4ee" font-weight="650">Install once</text>
<rect x="40" y="189" width="314" height="116" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="62" y="222" font-size="22" fill="#edf4ee" font-weight="650">LOCI.md</text>
<text x="62" y="250" font-size="19" fill="#b3c8ba" font-weight="400">Brain path + when to load rules</text>
<path d="M369 247 L407 247" fill="none" stroke="#87b79b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="423" y="189" width="497" height="116" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="445" y="222" font-size="22" fill="#edf4ee" font-weight="650">Install into native agent instructions</text>
<text x="445" y="250" font-size="19" fill="#b3c8ba" font-weight="400">Claude Code · Codex · WorkBuddy</text>
<text x="445" y="278" font-size="19" fill="#b3c8ba" font-weight="400">CLAUDE.md / AGENTS.md / MEMORY.md</text>
<text x="40" y="354" font-size="18" fill="#9cdbb6" font-weight="700">02</text>
<text x="83" y="354" font-size="22" fill="#edf4ee" font-weight="650">At session start: compact preferences</text>
<rect x="40" y="374" width="411" height="117" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="62" y="407" font-size="22" fill="#edf4ee" font-weight="650">With a hook: automatic context</text>
<text x="62" y="435" font-size="19" fill="#b3c8ba" font-weight="400">Without one: the agent calls it</text>
<text x="62" y="463" font-size="19" fill="#b3c8ba" font-weight="400">Both paths use the same reader</text>
<path d="M465 432 L495 432" fill="none" stroke="#87b79b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="511" y="374" width="409" height="117" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="533" y="407" font-size="22" fill="#edf4ee" font-weight="650">loci-context.js</text>
<text x="533" y="435" font-size="19" fill="#b3c8ba" font-weight="400">Reads me/preferences.md</text>
<text x="533" y="463" font-size="19" fill="#b3c8ba" font-weight="400">Returns preferences + file pointers</text>
<text x="40" y="545" font-size="18" fill="#9cdbb6" font-weight="700">03</text>
<text x="83" y="545" font-size="22" fill="#edf4ee" font-weight="650">At first memory use: read the manual, then act</text>
<rect x="40" y="565" width="260" height="118" rx="12" fill="#203c2c" stroke="#3d5647"/>
<text x="62" y="598" font-size="22" fill="#edf4ee" font-weight="650">LOCI-RULES.md</text>
<text x="62" y="626" font-size="19" fill="#b3c8ba" font-weight="400">Read in full once</text>
<text x="62" y="654" font-size="19" fill="#b3c8ba" font-weight="400">Reuse while valid</text>
<path d="M310 624 L339 624" fill="none" stroke="#87b79b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="351" y="565" width="260" height="118" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="373" y="598" font-size="22" fill="#edf4ee" font-weight="650">Read on demand</text>
<text x="373" y="626" font-size="19" fill="#b3c8ba" font-weight="400">Look up an index</text>
<text x="373" y="654" font-size="19" fill="#b3c8ba" font-weight="400">Open relevant records</text>
<path d="M621 624 L650 624" fill="none" stroke="#87b79b" stroke-width="2.3" marker-end="url(#arrow)"/>
<rect x="662" y="565" width="258" height="118" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="684" y="598" font-size="22" fill="#edf4ee" font-weight="650">Scripts / local API</text>
<text x="684" y="626" font-size="19" fill="#b3c8ba" font-weight="400">Validate, write, link</text>
<text x="684" y="654" font-size="19" fill="#b3c8ba" font-weight="400">Log the operation</text>
<rect x="40" y="704" width="382" height="78" rx="12" fill="#1a2820" stroke="#3d5647"/>
<text x="62" y="737" font-size="22" fill="#edf4ee" font-weight="650">Dashboard</text>
<text x="62" y="765" font-size="19" fill="#b3c8ba" font-weight="400">People view and edit the same data</text>
<path d="M231 790 L231 819" fill="none" stroke="#87b79b" stroke-width="2.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<path d="M791 696 L791 818" fill="none" stroke="#87b79b" stroke-width="2.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="40" y="831" width="880" height="65" rx="12" fill="#203c2c" stroke="#3d5647"/>
<text x="61" y="858" font-size="23" fill="#edf4ee" font-weight="650">Local Markdown · JSON · attachments</text>
<text x="61" y="882" font-size="17" fill="#b3c8ba" font-weight="400">Project details stay in their repository; the brain keeps an index.</text>
<text x="40" y="930" font-size="17" fill="#b3c8ba" font-weight="400">Hooks improve delivery, not compliance. Actual data stays on demand.</text>
</g></svg>
